name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64
            ext: .exe
          - platform: macos-latest
            target: aarch64
            ext: .dmg
          - platform: macos-latest
            target: x86_64
            ext: .dmg
          - platform: ubuntu-22.04
            target: x86_64
            ext: .AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-unknown-linux-gnu

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '语音输入法 ${{ github.ref_name }}'
          releaseBody: |
            ## 下载说明
            
            - **Windows**: 下载 `.exe` 或 `.msi` 文件安装
            - **macOS**: 下载 `.dmg` 文件，拖入 Applications 文件夹
            - **Linux**: 下载 `.AppImage` 文件，添加执行权限后运行
            
            ## 功能特性
            - 实时语音转文字
            - 在线/离线双模式
            - 中英文混合识别
            - 智能纠错
            
            详细使用说明请参考 [用户手册](https://github.com/Justinian-A/voice-input-method-app/blob/main/docs/用户手册.md)
          releaseDraft: false
          prerelease: false